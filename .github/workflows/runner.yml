name: 🔗 GHA
# Erethea: run on pushes to `main` and on pull requests only. The `upstream`
# branch mirrors Godot and is not built here.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.
  # Erethea: Windows first, and Linux must keep compiling. Android, iOS, macOS
  # and Web builds are disabled until the engine targets those platforms.

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/linux_builds.yml
    with:
      changed-files: ${{ needs.static-checks.outputs.changed-files }}

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/windows_builds.yml

  # Erethea: branding check, Windows installer and smoke test, window test,
  # upscaler tests, reference scene against stock Godot, editor MCP server,
  # checks before export, scenes built from game.project.json.

  erethea-branding:
    name: 🔥 Erethea branding
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check that the rebrand script is fully applied
        run: python3 erethea/tools/rebrand.py --check

  erethea-installer:
    name: 🔥 Erethea installer
    needs: windows-build
    uses: ./.github/workflows/erethea_installer.yml

  erethea-window:
    name: 🔥 Erethea window
    needs: windows-build
    uses: ./.github/workflows/erethea_window.yml

  erethea-amd-fsr:
    name: 🔥 Erethea AMD FSR
    needs: windows-build
    uses: ./.github/workflows/erethea_amd_fsr.yml

  erethea-xess:
    name: 🔥 Erethea XeSS
    needs: windows-build
    uses: ./.github/workflows/erethea_xess.yml

  erethea-dlss:
    name: 🔥 Erethea DLSS
    needs: windows-build
    uses: ./.github/workflows/erethea_dlss.yml

  erethea-reference-scene:
    name: 🔥 Erethea reference scene
    needs: linux-build
    uses: ./.github/workflows/erethea_reference_scene.yml

  erethea-mcp:
    name: 🔥 Erethea MCP
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_mcp.yml

  erethea-agent-test:
    name: 🔥 Erethea agent test
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_agent_test.yml

  erethea-export-checks:
    name: 🔥 Erethea export checks
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_export_checks.yml

  erethea-fornalha-import:
    name: 🔥 Erethea Fornalha import
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_fornalha_import.yml

  erethea-raytracing-fallback:
    name: 🔥 Erethea ray tracing fallback
    needs: windows-build
    uses: ./.github/workflows/erethea_raytracing_fallback.yml

  erethea-assistant:
    name: 🔥 Erethea assistant
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_assistant.yml

  erethea-preview:
    name: 🔥 Erethea preview
    needs: [linux-build, windows-build]
    uses: ./.github/workflows/erethea_preview.yml
