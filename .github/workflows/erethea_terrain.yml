name: 🔥 Erethea terrain
on:
  workflow_call:
  workflow_dispatch:

# Runs erethea/tests/terrain with the Linux editor built by linux_builds.yml, on
# the CPU with Mesa's lavapipe Vulkan driver: an EretheaTerrain3D made of
# procedural hills and two materials. The test casts rays on known points and
# checks that they hit the collision at the height of the data, saves a capture
# of the drawn terrain, checks that it isn't a single color, and prints
# ERETHEA_TERRAIN_OK. The capture is uploaded as an artifact.

jobs:
  terrain-linux:
    runs-on: ubuntu-24.04
    name: Terrain on Linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the lavapipe Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Download Linux editor
        uses: ./.github/actions/download-artifact
        with:
          name: linux-editor-mono
          path: bin

      - name: Import the test project
        run: |
          chmod +x bin/erethea.*
          cp -r erethea/tests/terrain "$RUNNER_TEMP/terrain"
          bin/erethea.linuxbsd.editor.x86_64.mono --headless --import --path "$RUNNER_TEMP/terrain"

      - name: Run the terrain test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          mkdir -p captures
          xvfb-run -a -s "-screen 0 1280x720x24" bin/erethea.linuxbsd.editor.x86_64.mono --path "$RUNNER_TEMP/terrain" \
            --audio-driver Dummy --fixed-fps 30 -- --out="$PWD/captures/terrain.png" 2>&1 | tee terrain.log
          grep -q ERETHEA_TERRAIN_OK terrain.log

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: erethea-terrain
          path: |
            captures
            terrain.log
          retention-days: 14
