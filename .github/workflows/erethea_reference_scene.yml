name: 🔥 Erethea Reference Scene
on:
  workflow_call:
  workflow_dispatch:

# Renders the reference scene (erethea/tests/reference_scene) with stock Godot
# and with the Linux editor built by linux_builds.yml, on the CPU with Mesa's
# lavapipe Vulkan driver, and compares the captures. With its default settings,
# Erethea must draw exactly like the Godot version it is based on, so that
# Godot projects keep their look. The captures, side by side, are uploaded as
# an artifact, and the job summary lists the differences and frame times.
#
# Then it captures the scene with each Erethea quality preset, and with the
# post-processing effects, and compares them with the default settings, without
# a limit: those differences are on purpose.
#
# The frame times come from a CPU renderer: they only compare one run with
# another, they don't say how fast a game runs on a graphics card.

env:
  # The Godot release that `upstream` is based on. Update it after each merge
  # of a new Godot version.
  GODOT_BASE_VERSION: 4.8-beta4
  # Largest allowed difference with stock Godot, as luminance RMSE (0 to 255).
  MAX_RMSE: 1.0

jobs:
  reference-scene:
    runs-on: ubuntu-24.04
    name: Reference scene against stock Godot
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the lavapipe Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Download Linux editor
        uses: ./.github/actions/download-artifact
        with:
          name: linux-editor-mono
          path: bin

      - name: Download stock Godot
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_BASE_VERSION}"
          file="Godot_v${GODOT_BASE_VERSION}_linux.x86_64"
          mkdir -p stock && cd stock
          curl -fsSL -o "$file.zip" "$base/$file.zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $file.zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$file.zip"
          chmod +x "$file"
          echo "GODOT_STOCK=$PWD/$file" >> "$GITHUB_ENV"
          chmod +x "$GITHUB_WORKSPACE"/bin/erethea.*
          echo "ERETHEA=$GITHUB_WORKSPACE/bin/erethea.linuxbsd.editor.x86_64.mono" >> "$GITHUB_ENV"

      - name: Capture with stock Godot
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          cp -r erethea/tests/reference_scene "$RUNNER_TEMP/scene_godot"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_STOCK" --path "$RUNNER_TEMP/scene_godot" \
            --audio-driver Dummy --fixed-fps 30 -- --capture="$PWD/captures/godot"

      - name: Capture with Erethea
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          cp -r erethea/tests/reference_scene "$RUNNER_TEMP/scene_erethea"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
            --audio-driver Dummy --fixed-fps 30 -- --capture="$PWD/captures/erethea"

      - name: Compare the captures
        run: |
          status=0
          "$ERETHEA" --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- \
            --baseline="$PWD/captures/godot" --candidate="$PWD/captures/erethea" \
            --out="$PWD/captures/comparison" --max-rmse="$MAX_RMSE" || status=$?
          {
            echo "## Cena de referência: Godot ${GODOT_BASE_VERSION} × Erethea"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Com as configurações padrão, a Erethea desenha igual à Godot (diferença máxima permitida: RMSE ${MAX_RMSE})."
            else
              echo "**A Erethea desenha diferente da Godot com as configurações padrão.** As imagens lado a lado estão no artefato \`reference-scene\` (Godot, Erethea, diferença)."
            fi
            echo
            cat captures/comparison/summary.md || true
            echo
            echo "Os tempos por quadro vêm do lavapipe, que desenha na CPU: servem só para comparar uma execução com outra."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Capture the quality presets
        if: always() && hashFiles('captures/erethea/results.json') != ''
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          {
            echo "## Presets de qualidade da Erethea"
            echo
            echo "Cada preset comparado com a Erethea sem preset (as configurações padrão da Godot)."
          } >> "$GITHUB_STEP_SUMMARY"
          for preset in low balanced cinematic; do
            xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
              --audio-driver Dummy --fixed-fps 30 -- --quality=$preset --capture="$PWD/captures/preset_$preset"
            "$ERETHEA" --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- \
              --baseline="$PWD/captures/erethea" --candidate="$PWD/captures/preset_$preset" \
              --out="$PWD/captures/comparison_$preset"
            {
              echo
              echo "### $preset"
              echo
              cat "captures/comparison_$preset/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Capture the post-processing effects
        if: always() && hashFiles('captures/erethea/results.json') != ''
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          # The color correction LUT (luts/cinematic.cube) needs the project
          # imported once. The capture below fails if the LUT isn't there.
          "$ERETHEA" --headless --import --path "$RUNNER_TEMP/scene_erethea" || true
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
            --audio-driver Dummy --fixed-fps 30 -- --post=all --capture="$PWD/captures/post_all" 2>&1 | tee post_all.log
          if grep -q "skipping the LUT" post_all.log; then
            echo "The .cube LUT was not imported."
            exit 1
          fi
          "$ERETHEA" --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- \
            --baseline="$PWD/captures/erethea" --candidate="$PWD/captures/post_all" \
            --out="$PWD/captures/comparison_post_all"
          {
            echo "## Pós-processamento da Erethea"
            echo
            echo "Erethea sem efeitos × com todos: LUT .cube (luts/cinematic.cube), lens flare, vinheta, aberração cromática e grão (EretheaPostEffect), motion blur (EretheaMotionBlur, com a câmera e o personagem em movimento) e raios de luz (EretheaLightShafts, com o sol movido para a frente da câmera: por isso a iluminação também muda aqui; a comparação só dos raios vem no passo seguinte)."
            echo
            cat captures/comparison_post_all/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The light shafts alone, against the same scene with the sun moved in
      # front of the camera (--sun=front) and no effect, so the only difference
      # is the shafts. In daylight, the sun is bright enough that the image
      # must change; at night, the dim moon doesn't light any shafts.
      - name: Capture the light shafts
        if: always() && hashFiles('captures/erethea/results.json') != ''
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
            --audio-driver Dummy --fixed-fps 30 -- --sun=front --capture="$PWD/captures/sun_front"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
            --audio-driver Dummy --fixed-fps 30 -- --post=shafts --capture="$PWD/captures/shafts"
          status=0
          "$ERETHEA" --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- \
            --baseline="$PWD/captures/sun_front" --candidate="$PWD/captures/shafts" \
            --out="$PWD/captures/comparison_shafts" \
            --min-rmse=0.3 --min-rmse-for=dia_vila,dia_floresta,dia_personagem || status=$?
          {
            echo "## Raios de luz da Erethea"
            echo
            echo "Mesma cena, com o sol na frente da câmera, sem × com o efeito EretheaLightShafts. De dia os raios têm que mudar a imagem (RMSE de pelo menos 0,3; a diferença fica perto do sol e nas silhuetas das casas, das árvores e do personagem, veja as imagens no artefato \`reference-scene\`). Sem o efeito no Compositor, nada muda: é o que o passo contra a Godot, acima, confere."
            if [ "$status" -ne 0 ]; then
              echo
              echo "**Os raios de luz não mudaram a imagem de dia.**"
            fi
            echo
            cat captures/comparison_shafts/summary.md || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Ray traced shadows of the sun (EretheaRayTracedShadows) instead of its
      # shadow map. lavapipe has ray queries, so the image is proven here: in
      # daylight it must change. Without the effect, the step against stock
      # Godot above shows that nothing changes.
      - name: Capture the ray traced shadows
        if: always() && hashFiles('captures/erethea/results.json') != ''
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$RUNNER_TEMP/scene_erethea" \
            --audio-driver Dummy --fixed-fps 30 -- --rt=shadows --capture="$PWD/captures/rt_shadows" 2>&1 | tee rt_shadows.log
          status=0
          if ! grep -q "Ray tracing: shadows" rt_shadows.log; then
            echo "::error::The ray traced shadows didn't start (no ray queries on this device?)."
            status=1
          fi
          "$ERETHEA" --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- \
            --baseline="$PWD/captures/erethea" --candidate="$PWD/captures/rt_shadows" \
            --out="$PWD/captures/comparison_rt_shadows" \
            --min-rmse=0.3 --min-rmse-for=dia_vila,dia_floresta,dia_personagem || status=$?
          {
            echo "## Sombras por ray tracing da Erethea"
            echo
            echo "Erethea sem efeitos × com EretheaRayTracedShadows no lugar do mapa de sombra do sol (lavapipe, com ray query). De dia a imagem tem que mudar (RMSE de pelo menos 0,3): as sombras ficam no mesmo lugar, com bordas suaves e firmes onde encostam. Veja as imagens no artefato \`reference-scene\`."
            if [ "$status" -ne 0 ]; then
              echo
              echo "**As sombras por ray tracing não rodaram ou não mudaram a imagem.**"
            fi
            echo
            cat captures/comparison_rt_shadows/summary.md || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The ray traced shadow of a mesh with a skeleton follows its pose: an arm
      # of two bones, straight and then bent (erethea/tests/raytracing).
      - name: Check the ray traced shadows of a skinned mesh
        if: always() && hashFiles('captures/erethea/results.json') != ''
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          mkdir -p captures/rt_skinned
          xvfb-run -a -s "-screen 0 1280x720x24" "$ERETHEA" --path erethea/tests/raytracing/shadows_scene \
            --audio-driver Dummy --fixed-fps 30 -- --skinned-check --out="$PWD/captures/rt_skinned/arm.png" 2>&1 | tee rt_skinned.log
          grep -q "ERETHEA_RT_SKINNED_OK" rt_skinned.log

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-scene
          path: captures
          retention-days: 30

  # Erethea streams the mipmaps of the textures used in 3D (modules/erethea_streaming).
  # The editor opens erethea/tests/texture_streaming, sees brick.png in a 3D
  # material and queues it; the next start switches it to the streamed importer.
  # Then the project checks that brick.png streams up to its full resolution,
  # looks like the same image without streaming, and goes back down when hidden,
  # and that ui_icon.png, only used in the UI, stays as in Godot.
  texture-streaming:
    runs-on: ubuntu-24.04
    name: Texture streaming of 3D textures
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the lavapipe Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Download Linux editor
        uses: ./.github/actions/download-artifact
        with:
          name: linux-editor-mono
          path: bin

      - name: Import the test project
        run: |
          chmod +x bin/erethea.*
          echo "ERETHEA=$GITHUB_WORKSPACE/bin/erethea.linuxbsd.editor.x86_64.mono" >> "$GITHUB_ENV"
          project="$RUNNER_TEMP/texture_streaming"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          cp -r erethea/tests/texture_streaming "$project"
          "$GITHUB_WORKSPACE/bin/erethea.linuxbsd.editor.x86_64.mono" --headless --import --path "$project"
          grep -q 'importer="texture"' "$project/brick.png.import"
          grep -q 'importer="texture"' "$project/ui_icon.png.import"

      - name: Open the scene in the editor
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" -e --path "$PROJECT" --audio-driver Dummy \
            --quit-after 3000 res://main.tscn 2>&1 | tee editor.log
          queue="$PROJECT/.godot/editor/erethea_texture_streaming.cfg"
          cat "$queue" || { echo "The editor didn't queue any texture."; exit 1; }
          grep -q 'res://brick.png' "$queue" || { echo "brick.png, used in 3D, wasn't queued."; exit 1; }
          if grep -q 'ui_icon.png' "$queue"; then
            echo "ui_icon.png is only used in the UI, but it was queued."
            exit 1
          fi

      - name: Switch the queued texture to the streamed importer
        run: |
          "$ERETHEA" --headless --import --path "$PROJECT" 2>&1 | tee import.log
          cat "$PROJECT/brick.png.import"
          grep -q 'importer="streamed_texture_2d"' "$PROJECT/brick.png.import"
          grep -q 'importer="texture"' "$PROJECT/ui_icon.png.import"
          ls "$PROJECT"/.godot/imported/brick.png-*.stex

      - name: Run the streaming checks
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ERETHEA" --path "$PROJECT" --audio-driver Dummy \
            -- --capture="$PWD/captures" 2>&1 | tee run.log
          grep -q ERETHEA_STREAMING_OK run.log
          {
            echo "## Streaming de texturas 3D"
            echo
            echo '```'
            grep -E "brick.png|ui_icon.png|RMSE" run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-streaming
          path: captures
          retention-days: 30
