name: 🔥 Erethea Installer
on:
  workflow_call:
  workflow_dispatch:

# Builds the Windows installer from the editor built by windows_builds.yml,
# installs it silently, and opens a plain Godot project with the installed
# Erethea: first an import in the editor, then a run of the main scene.
# This is the "done" test of phase 0. Then installs it again the way the
# editor updates itself.

jobs:
  installer:
    runs-on: windows-latest
    name: Windows installer and smoke test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows editor
        uses: ./.github/actions/download-artifact
        with:
          name: windows-editor
          path: bin

      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item bin/erethea.windows.editor.x86_64.exe erethea/installer/erethea.exe
          python erethea/tools/fetch_amd_fsr.py erethea/installer
          if ($LASTEXITCODE -ne 0) { throw "Couldn't download AMD's FSR runtime" }
          python erethea/tools/fetch_xess.py erethea/installer
          if ($LASTEXITCODE -ne 0) { throw "Couldn't download Intel's XeSS runtime" }
          $version = python -c "import version; print(f'{version.major}.{version.minor}')"
          & $env:ISCC "/DMyAppVersion=$version" erethea/installer/erethea.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Install silently
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Erethea"
          $p = Start-Process -Wait -PassThru erethea/installer/erethea-setup-x86_64.exe `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir/erethea.exe")) { throw "erethea.exe was not installed" }
          foreach ($dll in "amd_fidelityfx_upscaler_vk.dll", "amd_fidelityfx_upscaler_dx12.dll") {
            if (-not (Test-Path "$dir/$dll")) { throw "AMD's FSR runtime ($dll) was not installed" }
          }
          if (-not (Test-Path "$dir/libxess.dll")) { throw "Intel's XeSS runtime (libxess.dll) was not installed" }
          "ERETHEA_DIR=$dir" >> $env:GITHUB_ENV

      - name: Open a Godot project with the installed editor
        shell: pwsh
        run: |
          $exe = "$env:ERETHEA_DIR/erethea.exe"
          $project = "erethea/tests/smoke_project"

          & $exe --version
          & $exe --headless --import --path $project 2>&1 | Tee-Object -FilePath import.log
          if ($LASTEXITCODE -ne 0) { throw "Editor import failed with exit code $LASTEXITCODE" }

          & $exe --headless --path $project 2>&1 | Tee-Object -FilePath run.log
          if ($LASTEXITCODE -ne 0) { throw "Project run failed with exit code $LASTEXITCODE" }

          $errors = Select-String -Path import.log, run.log -Pattern "SCRIPT ERROR|Parse Error|^ERROR:"
          if ($errors) { $errors; throw "The editor reported errors while opening the project" }
          if (-not (Select-String -Path run.log -Pattern "ERETHEA_SMOKE_OK" -Quiet)) {
            throw "The project's main scene did not run"
          }
          Write-Output "The installed Erethea opened and ran the Godot project without errors."

      - name: Update silently, like the editor does
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Same arguments as EretheaUpdate::launch_installer(): the installer
          # must install over the previous one, then start the editor again.
          # Start-Process -Wait would also wait for that editor, so wait for
          # the installer only.
          $exe = Join-Path $env:ERETHEA_DIR "erethea.exe"
          $p = Start-Process -PassThru erethea/installer/erethea-setup-x86_64.exe `
            -ArgumentList "/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/update=1"
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(60)
          $editor = $null
          while (-not $editor) {
            $editor = Get-Process erethea -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
            if (-not $editor -and (Get-Date) -gt $deadline) { throw "The installer didn't start $exe again" }
            Start-Sleep -Seconds 1
          }
          Write-Output "The installer updated Erethea and started $exe again."
          $editor | Stop-Process -Force

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: erethea-setup-windows
          path: erethea/installer/erethea-setup-x86_64.exe
          retention-days: 30
