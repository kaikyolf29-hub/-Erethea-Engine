name: 🔥 Erethea Installer
on:
  workflow_call:
  workflow_dispatch:

# Builds the Windows installer from the editor built by windows_builds.yml,
# installs it silently, and opens a plain Godot project with the installed
# Erethea: first an import in the editor, then a run of the main scene.
# This is the "done" test of phase 0. Then installs it again the way the
# editor updates itself.

jobs:
  installer:
    runs-on: windows-latest
    name: Windows installer and smoke test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows editor
        uses: ./.github/actions/download-artifact
        with:
          name: windows-editor
          path: bin

      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item bin/erethea.windows.editor.x86_64.exe erethea/installer/erethea.exe
          python erethea/tools/fetch_amd_fsr.py erethea/installer
          if ($LASTEXITCODE -ne 0) { throw "Couldn't download AMD's FSR runtime" }
          python erethea/tools/fetch_xess.py erethea/installer
          if ($LASTEXITCODE -ne 0) { throw "Couldn't download Intel's XeSS runtime" }
          $version = python -c "import version; print(f'{version.major}.{version.minor}')"
          & $env:ISCC "/DMyAppVersion=$version" erethea/installer/erethea.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Install silently
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Erethea"
          $log = Join-Path $env:RUNNER_TEMP "erethea-install.log"
          $p = Start-Process -Wait -PassThru erethea/installer/erethea-setup-x86_64.exe `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "Installer failed with exit code $($p.ExitCode)"
          }
          if (-not (Test-Path "$dir/erethea.exe")) { throw "erethea.exe was not installed" }
          foreach ($dll in "amd_fidelityfx_upscaler_vk.dll", "amd_fidelityfx_upscaler_dx12.dll") {
            if (-not (Test-Path "$dir/$dll")) { throw "AMD's FSR runtime ($dll) was not installed" }
          }
          if (-not (Test-Path "$dir/libxess.dll")) { throw "Intel's XeSS runtime (libxess.dll) was not installed" }
          "ERETHEA_DIR=$dir" >> $env:GITHUB_ENV

      - name: Open a Godot project with the installed editor
        shell: pwsh
        run: |
          $exe = "$env:ERETHEA_DIR/erethea.exe"
          $project = "erethea/tests/smoke_project"

          & $exe --version
          & $exe --headless --import --path $project 2>&1 | Tee-Object -FilePath import.log
          if ($LASTEXITCODE -ne 0) { throw "Editor import failed with exit code $LASTEXITCODE" }

          & $exe --headless --path $project 2>&1 | Tee-Object -FilePath run.log
          if ($LASTEXITCODE -ne 0) { throw "Project run failed with exit code $LASTEXITCODE" }

          $errors = Select-String -Path import.log, run.log -Pattern "SCRIPT ERROR|Parse Error|^ERROR:"
          if ($errors) { $errors; throw "The editor reported errors while opening the project" }
          if (-not (Select-String -Path run.log -Pattern "ERETHEA_SMOKE_OK" -Quiet)) {
            throw "The project's main scene did not run"
          }
          Write-Output "The installed Erethea opened and ran the Godot project without errors."

      - name: Update silently, like the editor does
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Same arguments as EretheaUpdate::launch_installer(): the installer
          # must install over the previous one, then start the editor again.
          #
          # This step used to hang about every other run: past its own time
          # limit and the job's, with no log at all, not even of the steps
          # before. That's how the runner behaves when a process started by a
          # step outlives it while holding the step's output: it waits for that
          # output to end, forever. Start-Process passed this step's output to
          # the installer, and so to what it starts; and when the restarted
          # editor wasn't found, the step ended with that editor running.
          # So the installer is started without handles from this step
          # (ShellExecute), and everything the update started is stopped at the
          # end, whatever happened.
          $exe = [IO.Path]::GetFullPath((Join-Path $env:ERETHEA_DIR "erethea.exe"))
          $log = Join-Path $env:RUNNER_TEMP "erethea-update.log"
          # The installer, its temporary copy (in an is-*.tmp folder) and the
          # editors it starts.
          function Get-UpdateProcesses {
            Get-CimInstance Win32_Process | Where-Object {
              $_.Name -like "erethea*" -or ($_.ExecutablePath -and $_.ExecutablePath -like "*\is-*.tmp\*")
            }
          }
          try {
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = (Resolve-Path erethea/installer/erethea-setup-x86_64.exe).Path
            $info.Arguments = "/SILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS /update=1 /LOG=`"$log`""
            $info.UseShellExecute = $true
            $p = [System.Diagnostics.Process]::Start($info)
            Write-Output "$(Get-Date -Format o) Started the installer, process $($p.Id)."
            # Wait for the installer only: the editor it starts keeps running.
            if (-not $p.WaitForExit(240000)) {
              Write-Output "The installer didn't finish in 4 minutes. The end of its log:"
              if (Test-Path $log) { Get-Content $log -Tail 80 } else { Write-Output "(no log)" }
              throw "The installer hung."
            }
            Write-Output "$(Get-Date -Format o) The installer finished with exit code $($p.ExitCode)."
            if ($p.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw "Installer failed with exit code $($p.ExitCode)"
            }
            $deadline = (Get-Date).AddSeconds(60)
            $editor = $null
            while (-not $editor) {
              $editor = Get-CimInstance Win32_Process -Filter "Name = 'erethea.exe'" |
                Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath) -eq $exe }
              if (-not $editor) {
                if ((Get-Date) -gt $deadline) { throw "The installer didn't start $exe again" }
                Start-Sleep -Seconds 1
              }
            }
            Write-Output "$(Get-Date -Format o) The installer updated Erethea and started $exe again, process $(@($editor)[0].ProcessId)."
          } finally {
            $left = @(Get-UpdateProcesses)
            if ($left.Count -gt 0) {
              Write-Output "Stopping what the update started:"
              $left | Format-Table ProcessId, ParentProcessId, Name, ExecutablePath -AutoSize | Out-String -Width 300
              $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: Upload the installer's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: erethea-installer-logs
          path: ${{ runner.temp }}/erethea-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: erethea-setup-windows
          path: erethea/installer/erethea-setup-x86_64.exe
          retention-days: 30
