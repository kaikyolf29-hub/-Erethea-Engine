name: 🔥 Erethea AMD FSR
on:
  workflow_call:
  workflow_dispatch:

# Upscales the reference scene with AMD FSR (modules/erethea_upscale) in the
# Windows editor built by windows_builds.yml, with each rendering driver, on the
# CPU: Mesa's lavapipe stands in for a graphics card on Vulkan, and Microsoft's
# WARP on Direct3D 12. AMD's runtime then runs FSR 3.1 (FSR 4 needs an AMD
# graphics card). Each job checks that the runtime loads, that FSR upscales
# without errors, and that its image stays close to FSR 2.2's from the same
# frames. The captures, side by side, are uploaded as an artifact.
#
# This proves the integration, not the quality or speed on a graphics card: see
# "Não testado na placa" in erethea/README.md.

env:
  # Mesa for Windows (https://github.com/pal1000/mesa-dist-win), for lavapipe.
  MESA_VERSION: 26.2.7
  # WARP from NuGet (https://www.nuget.org/packages/Microsoft.Direct3D.WARP).
  WARP_VERSION: 1.0.22
  # Largest allowed difference with FSR 2.2, as luminance RMSE (0 to 255). Two
  # upscalers never match, this only catches a broken image.
  MAX_RMSE: 12.0

jobs:
  amd-fsr:
    runs-on: windows-latest
    name: AMD FSR on ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan (lavapipe)
            driver: vulkan
          - name: Direct3D 12 (WARP)
            driver: d3d12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows editor
        uses: ./.github/actions/download-artifact
        with:
          name: windows-editor
          path: bin

      - name: Download AMD's FSR runtime
        run: python erethea/tools/fetch_amd_fsr.py bin

      - name: Install the Vulkan loader and lavapipe
        if: matrix.driver == 'vulkan'
        shell: pwsh
        run: |
          # The Vulkan loader (vulkan-1.dll) comes with graphics drivers, which
          # the runner doesn't have. Browsers ship one for their own use.
          $loader = Get-ChildItem -Path "$env:WINDIR\System32\vulkan-1.dll", `
            "${env:ProgramFiles}\Google\Chrome\Application\*\vulkan-1.dll", `
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\vulkan-1.dll" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $loader) { throw "No vulkan-1.dll found on the runner" }
          Write-Output "Vulkan loader: $($loader.FullName)"
          Copy-Item $loader.FullName bin/

          $archive = "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/$archive" -OutFile $archive
          7z x $archive -omesa x64 -y | Out-Null
          $icd = Get-ChildItem -Recurse mesa -Filter "lvp_icd*.json" | Select-Object -First 1
          if (-not $icd) { Get-ChildItem -Recurse mesa | Select-Object -First 40 FullName; throw "lavapipe isn't in $archive" }
          Write-Output "lavapipe: $($icd.FullName)"
          # The runner's processes are elevated, and the Vulkan loader ignores
          # VK_DRIVER_FILES and VK_ICD_FILENAMES in elevated processes, so the
          # driver is registered like an installed one.
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null

      - name: Install a recent WARP
        if: matrix.driver == 'd3d12'
        shell: pwsh
        run: |
          # The runner's own WARP crashes in its shader compiler while compiling
          # AMD FSR's compute shaders (d3d10warp!ComputeShaderTransformer). Use
          # Microsoft's current one, which Direct3D 12 loads from the
          # executable's folder.
          $package = "microsoft.direct3d.warp.$env:WARP_VERSION.nupkg"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$env:WARP_VERSION/$package" -OutFile warp.zip
          Expand-Archive warp.zip -DestinationPath warp -Force
          Copy-Item warp/build/native/bin/x64/d3d10warp.dll bin/
          Write-Output "WARP: $((Get-Item bin/d3d10warp.dll).VersionInfo.FileVersion)"

      - name: Capture with FSR 2.2 and AMD FSR
        shell: pwsh
        run: |
          $exe = "bin/erethea.windows.editor.x86_64.exe"
          $project = "erethea/tests/reference_scene"
          foreach ($upscaler in "fsr2", "amd_fsr") {
            & $exe --path $project --rendering-driver ${{ matrix.driver }} --fixed-fps 30 -- `
              "--capture=$PWD/captures/$upscaler" "--upscaler=$upscaler" --warmup=12 --frames=4 2>&1 | Tee-Object -FilePath "$upscaler.log"
            if ($LASTEXITCODE -ne 0) { throw "The $upscaler capture failed with exit code $LASTEXITCODE" }
          }
          Select-String -Path amd_fsr.log -Pattern "Vulkan|lavapipe|D3D12|Direct3D|WARP|Basic Render|AMD FSR|FSR 2.2" | Select-Object -First 20

          if ("${{ matrix.driver }}" -eq "vulkan" -and (Select-String -Path amd_fsr.log -Pattern "switching to Direct3D 12" -Quiet)) {
            throw "Vulkan didn't start, so this job didn't test AMD FSR on Vulkan"
          }
          if (Select-String -Path amd_fsr.log -Pattern "Using FSR 2.2|AMD FSR couldn't|^ERROR:.*AMD FSR" -Quiet) {
            throw "AMD FSR didn't upscale, see amd_fsr.log above"
          }
          if (-not (Select-String -Path amd_fsr.log -Pattern "Erethea: upscaling with AMD FSR" -Quiet)) {
            throw "AMD FSR didn't start"
          }

      # Runs a short AMD FSR capture again with more messages from Erethea,
      # AMD's runtime and the graphics API's validation. On Direct3D 12 it runs
      # under the console debugger, which prints where it crashed. On Vulkan,
      # the Vulkan SDK's API dump layer prints the Vulkan call that failed.
      - name: Show where AMD FSR failed
        if: failure()
        shell: pwsh
        run: |
          $exe = "bin/erethea.windows.editor.x86_64.exe"
          $arguments = @("--path", "erethea/tests/reference_scene", "--rendering-driver", "${{ matrix.driver }}", "--fixed-fps", "30", "--verbose", "--gpu-validation", "--",
            "--capture=$PWD/captures/amd_fsr_debug", "--upscaler=amd_fsr", "--warmup=1", "--frames=1")
          if ("${{ matrix.driver }}" -eq "vulkan") {
            try {
              $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
              Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile vulkan-sdk.exe
              $sdk = "$env:RUNNER_TEMP\VulkanSDK"
              Start-Process -Wait -NoNewWindow -FilePath .\vulkan-sdk.exe -ArgumentList "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install"
              # Elevated processes only find layers through the registry.
              New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Force | Out-Null
              $layers = Get-ChildItem -Recurse $sdk -Filter "VkLayer_*.json"
              foreach ($layer in $layers) {
                New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Name $layer.FullName -PropertyType DWord -Value 0 -Force | Out-Null
              }
              Write-Output "Vulkan SDK $version layers: $($layers.Name -join ', ')"
            } catch {
              Write-Output "The Vulkan SDK didn't install: $_"
            }
            # Older Vulkan loaders only read VK_INSTANCE_LAYERS.
            $env:VK_INSTANCE_LAYERS = "VK_LAYER_LUNARG_api_dump"
            $env:VK_LOADER_LAYERS_ENABLE = "*api_dump"
            $env:VK_LOADER_DEBUG = "error,warn,layer"
            foreach ($prefix in "VK_APIDUMP", "VK_API_DUMP", "VK_LUNARG_API_DUMP") {
              Set-Item "env:$($prefix)_FILE" "true"
              Set-Item "env:$($prefix)_LOG_FILENAME" "$PWD\api_dump.txt"
              Set-Item "env:$($prefix)_OUTPUT_FORMAT" "text"
              Set-Item "env:$($prefix)_FLUSH" "false"
            }
            # The API dump is far too long for the job's log: print only the
            # messages, the failed calls and the calls AMD's runtime made.
            & $exe @arguments *> amd_fsr_debug.log
            $log = Get-Content amd_fsr_debug.log
            Write-Output "== Layers"
            $log | Select-String -Pattern "api_dump|khronos_validation" | Select-Object -First 15
            $failed = ($log | Select-String -Pattern "AMD FSR couldn't start" | Select-Object -First 1).LineNumber
            if ($failed) {
              Write-Output "== Messages before AMD FSR gave up"
              $log[[Math]::Max(0, $failed - 400)..($failed - 1)] | Select-String -Pattern "ERROR|WARNING|VUID|AMD FSR" | Select-Object -Last 60
            }
            Select-String -Path amd_fsr_debug.log -Pattern "AMD FSR|Erethea:" | Select-Object -First 20
          } else {
            $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cdb) {
              $env:_NT_SYMBOL_PATH = "srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols"
              & $cdb.FullName -g -G -lines -c "!gle; .ecxr; kn 60; lm o; q" $exe @arguments 2>&1 | Tee-Object -FilePath amd_fsr_debug.log
            } else {
              Write-Output "cdb.exe isn't on the runner; running without the debugger."
              & $exe @arguments 2>&1 | Tee-Object -FilePath amd_fsr_debug.log
            }
          }
          exit 0

      # Reads the API dump from the step above: the Vulkan calls that failed,
      # and the calls AMD's runtime made while it created the upscaler.
      - name: Show the Vulkan calls of AMD FSR
        if: failure() && matrix.driver == 'vulkan'
        shell: python
        run: |
          import collections
          import os
          import re

          if not os.path.exists("api_dump.txt"):
              print("No API dump was written.")
              raise SystemExit(0)
          with open("api_dump.txt", encoding="utf-8", errors="replace") as f:
              lines = f.read().splitlines()
          print(f"{len(lines)} lines. The dump starts with:")
          print("\n".join(lines[:25]))

          call_pattern = re.compile(r"(vk\w+)\(.*\)\s+returns\s+(\w+)\s*(VK_\w+)?")
          calls = []
          for number, line in enumerate(lines):
              match = call_pattern.search(line)
              if match:
                  calls.append((number, match.group(1), match.group(3) or ""))
          print(f"\n{len(calls)} calls.")
          results = collections.Counter((name, result) for _, name, result in calls if result and result != "VK_SUCCESS")
          print("Results other than VK_SUCCESS:", results.most_common(20))

          for number, name, result in [call for call in calls if call[2].startswith("VK_ERROR")][:3]:
              print(f"\n== {name} returned {result}, line {number + 1}:")
              print("\n".join(lines[max(0, number - 20) : number + 80]))

          # AMD's runtime starts by listing the device's extensions, which
          # Erethea only does before it creates the device.
          device = next((number for number, name, _ in calls if name == "vkCreateDevice"), None)
          start = next((index for index, (number, name, _) in enumerate(calls) if device is not None and number > device and name == "vkEnumerateDeviceExtensionProperties"), None)
          if start is None:
              print("\nNo call from AMD's runtime found.")
          else:
              print(f"\n== Calls from line {calls[start][0] + 1}:")
              for number, name, result in calls[start : start + 600]:
                  print(number + 1, name, result)

      - name: Compare AMD FSR with FSR 2.2
        shell: pwsh
        run: |
          & bin/erethea.windows.editor.x86_64.exe --headless --path erethea/tests/reference_scene --script res://compare_captures.gd -- `
            "--baseline=$PWD/captures/fsr2" "--candidate=$PWD/captures/amd_fsr" "--out=$PWD/captures/comparison" "--max-rmse=$env:MAX_RMSE" 2>&1 | Tee-Object -FilePath compare.log
          $code = $LASTEXITCODE
          "## AMD FSR contra FSR 2.2 (${{ matrix.name }}, Windows)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          Get-Content captures/comparison/summary.md -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "AMD FSR's image differs from FSR 2.2's more than $env:MAX_RMSE" }

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: erethea-amd-fsr-captures-${{ matrix.driver }}
          path: |
            captures
            *.log
          retention-days: 14
