name: 🔥 Erethea Window
on:
  workflow_call:
  workflow_dispatch:

# Opens the project manager and the editor built by windows_builds.yml on the
# runner's desktop, and checks the integrated title bar: no system title bar,
# resize borders, snapping to the screen edge, maximize and the caption buttons.
# It also runs a small game with the project setting
# `display/window/erethea/modern_title_bar` on and off.
# This is the "done" test of the title bar task of phase 1. The runner has no
# GPU, so the editor runs with the Compatibility renderer on ANGLE (WARP).

jobs:
  window:
    runs-on: windows-latest
    name: Windows title bar
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows editor
        uses: ./.github/actions/download-artifact
        with:
          name: windows-editor
          path: bin

      - name: Check the title bar
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "erethea-window"
          # The editor sometimes dies with a fast fail (0xC0000409), which its
          # own crash handler doesn't see. Ask Windows for a minidump of it,
          # which goes to the artifact with the logs.
          $dumps = Join-Path $out "dumps"
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\erethea.windows.editor.x86_64.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
          # ProcDump catches the fast fail itself, as a debugger: in the failures
          # so far Windows logged no crash event and wrote no dump.
          $procdump = Join-Path $env:RUNNER_TEMP "procdump"
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$procdump.zip"
          Expand-Archive "$procdump.zip" -DestinationPath $procdump -Force
          ./erethea/tests/window/title_bar_test.ps1 `
            -ProcDump (Join-Path $procdump "procdump64.exe") `
            -Editor (Resolve-Path bin/erethea.windows.editor.x86_64.exe) `
            -Project (Resolve-Path erethea/tests/smoke_project) `
            -GameProject (Resolve-Path erethea/tests/window/game_project) `
            -OutDir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: erethea-window-test
          path: ${{ runner.temp }}/erethea-window
          retention-days: 14
