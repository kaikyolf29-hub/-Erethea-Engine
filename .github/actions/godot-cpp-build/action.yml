name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    # Erethea: build godot-cpp from a short path. The workspace path of this
    # repository (/home/runner/work/-Erethea-Engine/-Erethea-Engine) is long
    # enough to push godot-cpp's `ar` command line past the 128 KiB limit of a
    # single shell argument ("Argument list too long").
    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: |
        mv ./godot-cpp "${{ runner.temp }}/gcpp"
        scons --directory="${{ runner.temp }}/gcpp/test" "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
